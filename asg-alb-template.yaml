AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates an Application Load Balancer, target group, EC2 launch template, and
  Auto Scaling group with a target-tracking scaling policy based on
  ALBRequestCountPerTarget.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC that contains the supplied subnets.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets used by both the ALB and Auto Scaling group.

  LaunchTemplateSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group to attach to EC2 instances in the launch template.

  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the Application Load Balancer.

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: AMI used by the launch template.

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for the Auto Scaling group.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name for instance SSH access.

  TargetRequestsPerInstance:
    Type: Number
    Default: 300
    Description: Desired ALBRequestCountPerTarget value for the target-tracking policy.

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroupId

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  WebLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !Ref LaunchTemplateSecurityGroupId
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-instance'
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-volume'
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            yum update -y
            amazon-linux-extras install nginx1 -y
            systemctl enable nginx
            echo "<h1>${AWS::StackName} - ASG instance</h1>" > /usr/share/nginx/html/index.html
            systemctl start nginx

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier: !Ref SubnetIds
      MinSize: 1
      DesiredCapacity: 2
      MaxSize: 4
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs:
        - !Ref AlbTargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref WebLaunchTemplate
        Version: !GetAtt WebLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-asg-instance'
          PropagateAtLaunch: true

  AlbRequestTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join
            - '/'
            - - !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
              - !GetAtt AlbTargetGroup.TargetGroupFullName
        TargetValue: !Ref TargetRequestsPerInstance

Outputs:
  LoadBalancerDNSName:
    Description: Public DNS name of the Application Load Balancer.
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  TargetGroupArn:
    Description: ARN of the target group associated with the ASG.
    Value: !Ref AlbTargetGroup

  AutoScalingGroupName:
    Description: Name of the Auto Scaling group.
    Value: !Ref AutoScalingGroup

